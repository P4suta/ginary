# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "ginary"
description = "Package a Gleam application and a trimmed BEAM runtime into one executable"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/P4suta/ginary"
publish = false
rust-version = "1.88"
readme = "README.md"
keywords = ["gleam", "erlang", "beam", "packaging", "single-binary"]
categories = ["command-line-utilities", "development-tools"]

[features]
# The command line half. On by default, so a plain `cargo build` is the build
# tool; `--no-default-features` is the launcher-only *stub* a cross-target
# artifact is made from, which carries no clap, no TOML reader and none of the
# build-side commands. See `docs/dev/log/C2.md`.
default = ["cli"]
cli = ["dep:clap", "dep:toml", "dep:ureq"]
# Fault injection for the launcher tests. Off by default, so a release build
# holds none of the points and never reads `GINARY_FAULT`; `mise run test` and
# CI turn it on. See `src/fault.rs` and `docs/dev/testing.md`.
fault-injection = []

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"], optional = true }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# Hex is the spelling every SHA-256 in the format has: the cache key, the
# `sha256` field of `ginary.index.json` and both digests of a checksum
# mismatch. Writing it by hand is four lines that nothing would test.
hex = "0.4.3"
# `elf`, `macho` and `pe` are named rather than left to the `read` umbrella that
# would pull them in anyway: `stub::verify` reads a COFF machine field for a
# Windows stub and an ELF header for every other target, and `native` reads a
# Mach-O header for a macOS shipment, so all three are load-bearing and a
# future trim of this line has to say so on purpose.
object = { version = "0.40.0", default-features = false, features = [
  "read",
  "elf",
  "macho",
  "pe",
  "std",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# The payload's checksum, the trailer's `sha256` and every entry of the index.
# 0.11 is the `digest` 0.11 line: `Output<Sha256>` is a `hybrid-array` `Array`
# rather than the `generic-array` one, and the `std` feature is gone — this
# crate never asked `sha2` for an `Error`, so nothing here needed it.
# `default-features = false` drops the other two defaults for the same reason:
# `oid` exists to hand out an X.509 object identifier and pulls `const-oid` in
# to do it, and `alloc` exists for the boxed `DynDigest`. ginary hashes bytes
# and prints hex.
sha2 = { version = "0.11.0", default-features = false }
# The artifact is written through `NamedTempFile::persist`: a whole executable
# built in the output directory and renamed onto its destination, so a failed
# build leaves neither a half-written file nor one that crosses a filesystem
# on the way in.
tempfile = "3.27.0"
# The payload is a tar archive. `HeaderMode::Deterministic` and `unpack_in`
# are the two pieces `src/payload.rs` is built on: the first is what makes two
# packs of one tree byte-identical, the second is the path check that keeps an
# entry from escaping the destination.
tar = "0.4.46"
thiserror = "2.0.18"
# `gleam.toml` is TOML, and `[tools.ginary]` is read through serde with
# `deny_unknown_fields`: a key ginary does not know is a setting the user
# believes is in force, and the error has to name it. `default-features` keeps
# the writer out — nothing in ginary writes TOML.
#
# Held at 0.9 deliberately. 1.0.0 is out and the pre-push freshness gate offers
# it every run; taking it is a major of the reader every `gleam.toml` goes
# through, and it wants a change of its own that re-reads the config tests
# against the new behaviour rather than a line in an unrelated milestone. See
# docs/dev/log/E4.md.
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"], optional = true }
# The payload's compression. `default-features = false` keeps the multi-threaded
# encoder and the `zstdmt` C sources out: packing is single-threaded on purpose,
# because a thread count that varies with the machine varies the output bytes.
zstd = { version = "0.13.3", default-features = false }
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "gzip", "platform-verifier"], optional = true }

[target.'cfg(unix)'.dependencies]
# The system calls the launcher cannot do without and the standard library
# does not expose: `getuid` for the `${TMPDIR}/ginary-<uid>` fallback, `flock`
# for the lock a running application holds on its cache entry, the `fcntl` that
# clears `FD_CLOEXEC` off that lock so it belongs to the runtime across
# `execve`, `syncfs` for the one-call durability barrier before an entry is
# renamed into place, and `kill(pid, 0)` for the liveness probe `cache::sweep`
# puts to the process table before it removes another launcher's temporary
# tree. rustix wraps them all safely, so the unix launcher path opens no
# `unsafe` block; on Linux it uses its own raw syscall backend, so nothing new
# is dynamically linked. Unix only: Windows has none of them and takes a share
# mode on the handle, a per-file `fsync` and `OpenProcess` instead. See
# `src/cache_lock.rs` and `src/cache.rs`.
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs", "process"] }

[target.'cfg(windows)'.dependencies]
# The three Win32 facilities the crate's Windows path is built on, and nothing
# else. `SetConsoleCtrlHandler` keeps Ctrl-C from killing the launcher out from
# under the runtime it is waiting for, and a job object with
# `JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE` makes a killed launcher take the runtime
# with it rather than leaving an orphan holding a cache entry. Both are needed
# because Windows has no `execve`: the launcher stays resident as the runtime's
# parent. The third is not the launcher's: `OpenProcess` with
# `PROCESS_QUERY_LIMITED_INFORMATION` is how `cache::sweep` asks whether the
# process that owns a temporary tree still exists, which is `kill(pid, 0)` on
# unix, and it is what `Win32_System_Threading` is in the list for.
# `Win32_Security` is in it for a signature rather than for a call of ours: the
# job-object entry points take a `SECURITY_ATTRIBUTES` pointer. See
# `docs/adr/0015-windows-launcher-stays-resident.md`.
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
assert_cmd = "2.0.17"
# The same crate `src/beam.rs` decompresses a stripped module with, so that the
# integration tests can build one: a `.beam` a real runtime rewrote is a gzip
# member, and the gzip branch of the reader is not reachable from bytes a test
# writes by hand.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
insta = "1.48.0"
predicates = "3.1.3"
proptest = "1.11.0"
# The YAML reader the repository-record tests parse `.github/` with. GitHub
# loads the issue forms, `dependabot.yml` and every workflow with a YAML
# reader, so a substring assertion over those files is happy with one no
# reader will accept — see
# `tests/regressions/e3_an_issue_form_was_not_valid_yaml.rs`. Dev only: it
# reaches neither half of the binary. `default-features = false` drops the
# `encoding` feature and `encoding_rs` with it; every file here is UTF-8.
saphyr = { version = "0.0.12", default-features = false }

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

[profile.dev]
# The debug information stays in the object files rather than in the binary.
# Nothing is lost — the `.o` files sit beside it in `target/debug`, so a
# backtrace and a debugger still resolve — and the binary itself stops being
# tens of megabytes of DWARF. That matters here for one reason: a host build
# appends its payload to *the running ginary*, so `tests/artifact_real.rs` and
# `tests/e2e_hello.rs` build a real artifact out of the debug binary and hold
# it to a size budget. Without this the C3 network stack's debug information
# alone would put that artifact over the budget, and the budget is the claim
# this project is about.
split-debuginfo = "unpacked"
