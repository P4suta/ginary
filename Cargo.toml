# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "ginary"
description = "Package a Gleam application and a trimmed BEAM runtime into one executable"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/P4suta/ginary"
publish = false
rust-version = "1.88"
readme = "README.md"
keywords = ["gleam", "erlang", "beam", "packaging", "single-binary"]
categories = ["command-line-utilities", "development-tools"]

[features]
# Fault injection for the launcher tests. Off by default, so a release build
# holds none of the points and never reads `GINARY_FAULT`; `mise run test` and
# CI turn it on. See `src/fault.rs` and `docs/dev/testing.md`.
fault-injection = []

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# Hex is the spelling every SHA-256 in the format has: the cache key, the
# `sha256` field of `ginary.index.json` and both digests of a checksum
# mismatch. Writing it by hand is four lines that nothing would test.
hex = "0.4.3"
object = { version = "0.40.0", default-features = false, features = ["read", "elf", "std"] }
# Two system calls the launcher cannot do without and the standard library does
# not expose: `getuid` for the `${TMPDIR}/ginary-<uid>` fallback, and `syncfs`
# for the one-call durability barrier before a cache entry is renamed into
# place. rustix wraps both safely, so the crate keeps `#![forbid(unsafe_code)]`
# rather than opening an `unsafe` block on the launcher path; on Linux it uses
# its own raw syscall backend, so nothing new is dynamically linked.
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# The payload's checksum, the trailer's `sha256` and every entry of the index.
sha2 = "0.10.9"
# The artifact is written through `NamedTempFile::persist`: a whole executable
# built in the output directory and renamed onto its destination, so a failed
# build leaves neither a half-written file nor one that crosses a filesystem
# on the way in.
tempfile = "3.27.0"
# The payload is a tar archive. `HeaderMode::Deterministic` and `unpack_in`
# are the two pieces `src/payload.rs` is built on: the first is what makes two
# packs of one tree byte-identical, the second is the path check that keeps an
# entry from escaping the destination.
tar = "0.4.46"
thiserror = "2.0.18"
# `gleam.toml` is TOML, and `[tools.ginary]` is read through serde with
# `deny_unknown_fields`: a key ginary does not know is a setting the user
# believes is in force, and the error has to name it. `default-features` keeps
# the writer out — nothing in ginary writes TOML.
toml = { version = "0.9.12", default-features = false, features = ["parse", "serde"] }
# The payload's compression. `default-features = false` keeps the multi-threaded
# encoder and the `zstdmt` C sources out: packing is single-threaded on purpose,
# because a thread count that varies with the machine varies the output bytes.
zstd = { version = "0.13.3", default-features = false }

[dev-dependencies]
assert_cmd = "2.0.17"
# The same crate `src/beam.rs` decompresses a stripped module with, so that the
# integration tests can build one: a `.beam` a real runtime rewrote is a gzip
# member, and the gzip branch of the reader is not reachable from bytes a test
# writes by hand.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
insta = "1.48.0"
predicates = "3.1.3"
proptest = "1.11.0"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
