# SPDX-License-Identifier: MIT OR Apache-2.0
name: Distribute

# Run from the existing tag being built. Hosted release mutation requires publish=true.
# The default run produces only reviewable workflow artifacts.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and verify
        required: true
        type: string
      publish:
        description: Upload to an existing draft and publish after verification
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      publish:
        type: boolean
        default: false

permissions: {}

concurrency:
  group: distribution-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag a release carries and the version Cargo.toml carries must be one
  # number before anything is built, or the assets uploaded under v0.1.0 would
  # carry other internals. ginary is version-locked to its stubs.
  version-check:
    name: Version consistency
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
      epoch: ${{ steps.revision.outputs.epoch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require the requested tag's execution context
        id: execution-context
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Distribution must run from the requested tag: select that tag as the workflow ref and tag input." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: revision
        name: Verify the tag still identifies the event commit
        shell: bash
        run: |
          head_commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse --verify "$GITHUB_REF^{commit}")
          if [[ "$head_commit" != "$GITHUB_SHA" || "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "The checkout or tag differs from the workflow event commit; start a new run from the intended tag." >&2
            exit 1
          fi
          echo "commit=$head_commit" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - run: scripts/ci/version-consistency.sh "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}

  # The full binary and the launcher-only stub for the four Linux targets, via
  # cross, each with the catalog OTP tarball its runtime comes from.
  build-linux:
    name: Build ${{ matrix.target }}
    needs: version-check
    env:
      SOURCE_DATE_EPOCH: ${{ needs.version-check.outputs.epoch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64-gnu
            triple: x86_64-unknown-linux-gnu
          - target: linux-x86_64-musl
            triple: x86_64-unknown-linux-musl
          - target: linux-aarch64-gnu
            triple: aarch64-unknown-linux-gnu
          - target: linux-aarch64-musl
            triple: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cross@0.2.5
      - name: Build the full binary and the stub
        env:
          CARGO_TARGET_DIR: target/cross
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          mkdir -p dist/release
          cross build --release --locked --target "${{ matrix.triple }}"
          cp "target/cross/${{ matrix.triple }}/release/ginary" \
             "dist/release/ginary-$version-${{ matrix.target }}"
          cross build --release --locked --no-default-features --target "${{ matrix.triple }}"
          cp "target/cross/${{ matrix.triple }}/release/ginary" \
             "dist/release/ginary-stub-$version-${{ matrix.target }}"
      - name: Repack the OTP catalog tarball for this target
        run: |
          case "${{ matrix.target }}" in
            *-musl) spec="${{ matrix.target }}:static" ;;
            *)      spec="${{ matrix.target }}" ;;
          esac
          cargo run --quiet --locked -- otp repack \
            --upstream-tag OTP-29.0.5 --targets "$spec" --out dist/release
        env:
          # `ginary otp repack` reads the upstream release through the GitHub
          # API. An unauthenticated read is limited to 60 an hour by source
          # address, which every hosted runner in a pool shares, and the answer
          # over it is a 403 nothing retries its way out of. `contents: read` is
          # all this needs; the token moves the read onto this repository's own
          # budget. See tests/regressions/e22_an_unauthenticated_api_read_was_refused_without_saying_why.rs.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  # The two macOS targets, built natively on the two runner architectures: the
  # darwin stub comes from here and from nowhere else.
  build-macos:
    name: Build ${{ matrix.target }}
    needs: version-check
    env:
      SOURCE_DATE_EPOCH: ${{ needs.version-check.outputs.epoch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15-intel, not the withdrawn macos-13: a label GitHub no longer
          # schedules leaves the job queued for ever and the release run with
          # it. See tests/regressions/e6_the_macos_matrix_asked_for_a_runner_github_retired.rs.
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: macos-14
            target: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.5"
          gleam-version: "1.18.1"
      - name: Build the full binary and the stub
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          mkdir -p dist/release
          cargo build --release --locked
          cp target/release/ginary "dist/release/ginary-$version-${{ matrix.target }}"
          cargo build --release --locked --no-default-features
          cp target/release/ginary "dist/release/ginary-stub-$version-${{ matrix.target }}"
      - name: Repack the OTP catalog tarball for this target
        run: |
          cargo run --quiet --locked -- otp repack \
            --upstream-tag OTP-29.0.5 --targets "${{ matrix.target }}" --root "$INSTALL_DIR_FOR_OTP" --out dist/release
        env:
          # `ginary otp repack` reads the upstream release through the GitHub
          # API. An unauthenticated read is limited to 60 an hour by source
          # address, which every hosted runner in a pool shares, and the answer
          # over it is a 403 nothing retries its way out of. `contents: read` is
          # all this needs; the token moves the read onto this repository's own
          # budget. See tests/regressions/e22_an_unauthenticated_api_read_was_refused_without_saying_why.rs.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  # The Windows target, built natively so the launcher path compiles and links
  # against the real toolchain.
  build-windows:
    name: Build windows-x86_64
    needs: version-check
    env:
      SOURCE_DATE_EPOCH: ${{ needs.version-check.outputs.epoch }}
    # windows-2022, matching ci.yml's `windows` job: the image a release is
    # built on is the image the launcher was proved on. windows-2025 is
    # offered; the two move together or not at all. See docs/dev/log/E4.md.
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.5"
          gleam-version: "1.18.1"
      - name: Build the full binary and the stub
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          mkdir -p dist/release
          cargo build --release --locked
          cp target/release/ginary.exe "dist/release/ginary-$version-windows-x86_64.exe"
          cargo build --release --locked --no-default-features
          cp target/release/ginary.exe "dist/release/ginary-stub-$version-windows-x86_64.exe"
      - name: Repack the native Windows runtime
        shell: bash
        run: |
          cargo run --quiet --locked -- otp repack --upstream-tag OTP-29.0.5 \
            --targets windows-x86_64 --root "$INSTALL_DIR_FOR_OTP" --out dist/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows-x86_64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  # Assembly is a read-only rehearsal with respect to hosted releases by default.
  publish:
    name: Assemble and verify distribution
    needs: [version-check, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist/fragments
      - name: Compute SHA256SUMS and merge every target catalog
        run: |
          cargo run --quiet --locked -- otp merge --inputs dist/fragments \
            --out dist/release --version "${RELEASE_TAG#v}"
          cd dist/release
          sha256sum --check SHA256SUMS
      - name: Require the existing release to be a draft
        if: ${{ inputs.publish }}
        run: bash scripts/ci/publish-distribution.sh check "$RELEASE_TAG" dist/release
      - name: Attest build provenance for every asset
        if: ${{ inputs.publish }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/ginary-*
            dist/release/otp-*.tar.zst
            dist/release/catalog.json
            dist/release/inventory.json
      - name: Upload to the existing draft, re-download and check, then publish
        if: ${{ inputs.publish }}
        run: bash scripts/ci/publish-distribution.sh publish "$RELEASE_TAG" dist/release
      - name: Preserve the local distribution and inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-distribution
          path: dist/release
          if-no-files-found: warn
          retention-days: 30
