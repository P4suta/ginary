# SPDX-License-Identifier: MIT OR Apache-2.0
name: Scorecard supply-chain security

# OpenSSF Scorecard grades this repository's supply-chain posture — pinned
# actions, branch protection, a security policy, dangerous workflow patterns —
# and publishes the grade, which is what makes the README badge a number a
# stranger can check rather than a claim.
#
# `branch_protection_rule` is in the trigger list on purpose: the ruleset under
# .github/rulesets/ is half of the score, so loosening it re-runs the scan.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    # Weekly, on a slot nobody else holds: `11 20` and `31 20` belong to the
    # sibling repositories and `41 20` to this repository's own CodeQL scan.
    - cron: "51 20 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    # The scan is only meaningful against the default branch.
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'branch_protection_rule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The SARIF upload writes code-scanning alerts.
      security-events: write
      # `publish_results` signs the result with an OIDC token; without this the
      # published record, and therefore the badge, is not produced.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the SARIF as a run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif-${{ github.run_id }}
          path: results.sarif
          retention-days: 7
      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
