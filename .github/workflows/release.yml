# SPDX-License-Identifier: MIT OR Apache-2.0
name: Release

# release-please watches `main`: it maintains a release pull request that bumps
# the version and updates CHANGELOG.md from the Conventional Commits since the
# last release, and — when that pull request is merged — creates the draft
# GitHub release and the tag. Distribution is a separate explicit invocation of
# distribute.yml with the existing tag. Its default run builds and verifies;
# uploading and publishing the draft require publish=true. Publishing a release
# does not trigger distribution. Merging the release-please pull request remains
# a separate human decision from merging an ordinary implementation pull request.
#
# The two App credentials live in the `release` GitHub Environment rather than
# at repository scope, and that decides the shape of the job below. An
# environment's variables and secrets reach a job only when the job declares
# that environment, and a job that declares an environment the current ref may
# not deploy to does not skip — the run fails with `Branch is not allowed to
# deploy to release due to environment protection rules`. The environment's
# deployment-branch policy admits the `main` branch and the `v*` tags and
# nothing else, so this workflow triggers on a push to `main` and on nothing
# else: a `pull_request` or a `workflow_dispatch` trigger could aim the
# environment-bound job at a ref the policy refuses.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Maintain the release PR and draft
    # The one job that reads either credential, and therefore the one job that
    # declares the environment holding them. It carries no `if:`: a job
    # condition is evaluated before the job's environment is bound, so it
    # cannot see `vars.RELEASE_PLEASE_APP_CLIENT_ID` as the environment fills
    # it — and cannot see a `secrets` context at all. The decision moves to the
    # first step, which reads what the environment holds and publishes the
    # answer for the later steps to be guarded on.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      # Read, and only for the checkout. Every write release-please makes — the
      # version bump, the changelog, the pull request, the tag and the draft
      # release — travels on the App installation token minted below, so the
      # workflow's own GITHUB_TOKEN needs nothing it did not already have.
      contents: read
    steps:
      - name: Fetch automation credentials
        id: doppler_automation_0
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: ginary
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.doppler_automation_0.outcome == 'success' && (
          steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1

      - name: Check what the release environment holds
        id: credentials
        env:
          CLIENT_ID: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "state=configured" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLIENT_ID" ] && [ -z "$PRIVATE_KEY" ]; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
          elif [ -z "$PRIVATE_KEY" ]; then
            echo "::error title=Release automation is half-configured::The release environment holds RELEASE_PLEASE_APP_CLIENT_ID but not RELEASE_PLEASE_APP_PRIVATE_KEY. Add it under Settings -> Environments -> release -> Environment secrets, or remove RELEASE_PLEASE_APP_CLIENT_ID to return to the report-and-stay-green state."
            exit 1
          else
            echo "::error title=Release automation is half-configured::The release environment holds RELEASE_PLEASE_APP_PRIVATE_KEY but not RELEASE_PLEASE_APP_CLIENT_ID. Add it under Settings -> Environments -> release -> Environment variables, or remove RELEASE_PLEASE_APP_PRIVATE_KEY to return to the report-and-stay-green state."
            exit 1
          fi
      # The other half of the guard. Installing the App and adding its two
      # credentials needs a human with admin rights, so the workflow cannot do
      # it and must not pretend the release automation is running when it is
      # not. This step reports the state and exits 0: green, and specific about
      # why. It is a step of this job rather than a job of its own because the
      # values it reports on are only readable from a job that declares the
      # environment.
      - name: Say which credentials a maintainer has to add
        if: ${{ steps.credentials.outputs.state == 'absent' }}
        run: |
          echo "::notice title=Release automation is not configured::release-please did not run; the release environment holds no credentials. See the job log for the two a maintainer has to add."
          cat <<'NOTICE'
          The release environment of this repository holds no credentials, so the
          release-please job did nothing. Nothing is broken and nothing is pending.

          To turn release automation on, a maintainer with admin rights does three things:

            1. Install the release-please GitHub App on P4suta/ginary, granting it
               contents: write, pull-requests: write and issues: write.
            2. Add RELEASE_PLEASE_APP_CLIENT_ID, set to the App's client id, under
               Settings -> Environments -> release -> Environment variables.
            3. Add RELEASE_PLEASE_APP_PRIVATE_KEY, set to the App's private key, under
               Settings -> Environments -> release -> Environment secrets.

          Both belong to the release environment rather than to repository scope, which
          applies two restrictions repository scope does not. An environment's values
          reach a job only when that job declares the environment, so a job that does
          not name it is handed nothing; and they are released only on a ref the
          environment's deployment-branch policy admits, which here is the main branch
          and the v* tags and nothing else. Neither value is therefore reachable from a
          pull request, from a fork, or from any other branch.

          The default GITHUB_TOKEN is deliberately not an alternative: this repository
          sets can_approve_pull_request_reviews to false, so GitHub Actions may not
          create pull requests, and that hardening stays.
          NOTICE
      # No repository contents are needed, but the checkout keeps the token out
      # of the local git config for any later step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.credentials.outputs.state == 'configured' }}
        with:
          persist-credentials: false
      # A repository-scoped installation token for the release-please App, the
      # same pattern the strict siblings (release-glz, beamtrace) use. An App
      # is not GitHub Actions, so the "Actions may not create pull requests"
      # rule does not apply to it, and the hardening stays as it is.
      - name: Fetch automation credentials
        id: doppler_automation_3
        if: "${{ steps.credentials.outputs.state == 'configured' }}"
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: ginary
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.doppler_automation_3.outcome == 'success' && (
          steps.doppler_automation_3.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.doppler_automation_3.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.doppler_automation_3.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.doppler_automation_3.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: ${{ steps.credentials.outputs.state == 'configured' }}
        with:
          client-id: ${{ steps.doppler_automation_3.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.doppler_automation_3.outputs.GITHUB_APP_PRIVATE_KEY }}
          # Exactly what release-please does and nothing more: it writes the
          # version bump and the changelog, opens and updates the pull request,
          # and labels it (a label is an issues-scope write on a PR).
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: ${{ steps.credentials.outputs.state == 'configured' }}
        with:
          # The App token, explicitly. Without a `token:` input release-please
          # falls back to the workflow's own GITHUB_TOKEN, which is the token
          # that failed the first live run with `GitHub Actions is not
          # permitted to create or approve pull requests`.
          token: ${{ steps.app-token.outputs.token }}
          # The config and the manifest are committed at the repository root;
          # `draft: true` in release-please-config.json makes the created release
          # a draft. Invoke distribute.yml explicitly with its existing tag;
          # the default is verification only, and publication needs publish=true.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
