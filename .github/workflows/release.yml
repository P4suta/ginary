name: Release

# release-please watches `main`: it maintains a release pull request that bumps
# the version and updates CHANGELOG.md from the Conventional Commits since the
# last release, and — when that pull request is merged — creates the draft
# GitHub release and the tag. Publishing the artifacts is distribute.yml's job,
# triggered when the draft release is published. Nothing here tags or publishes
# on its own; the release-please pull request is a human decision.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Maintain the release PR and draft
    # Only when the App is installed. The default GITHUB_TOKEN cannot open a
    # pull request here — `can_approve_pull_request_reviews` is false on this
    # repository, the hardening E3 applied on purpose — so without the App
    # credentials release-please has nothing to authenticate with. Skipping is
    # the honest answer; `credentials-notice` below says so out loud, and a
    # repository with no release automation configured gets a green Release
    # workflow rather than a red one nobody in the tree can fix.
    if: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Read, and only for the checkout. Every write release-please makes — the
      # version bump, the changelog, the pull request, the tag and the draft
      # release — travels on the App installation token minted below, so the
      # workflow's own GITHUB_TOKEN needs nothing it did not already have.
      contents: read
    steps:
      # A job's `if:` can read `vars.` and cannot read `secrets.`, so the guard
      # above proves the client id exists and can prove nothing about the
      # private key. A repository with the variable set and the secret missing
      # would reach `create-github-app-token` with an empty `private-key:` and
      # fail somewhere inside JWT signing. Naming the missing credential is
      # cheaper to read than that. This one is a failure rather than a notice:
      # unlike a repository with no credentials at all, somebody here set the
      # variable on purpose and the automation they asked for is not running.
      - name: Check the App private key is present
        env:
          PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error title=Release automation is half-configured::RELEASE_PLEASE_APP_CLIENT_ID is set, but the RELEASE_PLEASE_APP_PRIVATE_KEY secret is empty or absent. Add it under Settings -> Secrets and variables -> Actions -> Secrets, or clear RELEASE_PLEASE_APP_CLIENT_ID to return to the skip-and-report state."
            exit 1
          fi
      # No repository contents are needed, but the checkout keeps the token out
      # of the local git config for any later step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A repository-scoped installation token for the release-please App, the
      # same pattern the strict siblings (release-glz, beamtrace) use. An App
      # is not GitHub Actions, so the "Actions may not create pull requests"
      # rule does not apply to it, and the hardening stays as it is.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Exactly what release-please does and nothing more: it writes the
          # version bump and the changelog, opens and updates the pull request,
          # and labels it (a label is an issues-scope write on a PR).
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # The App token, explicitly. Without a `token:` input release-please
          # falls back to the workflow's own GITHUB_TOKEN, which is the token
          # that failed the first live run with `GitHub Actions is not
          # permitted to create or approve pull requests`.
          token: ${{ steps.app-token.outputs.token }}
          # The config and the manifest are committed at the repository root;
          # `draft: true` in release-please-config.json is what makes the
          # created release a draft, so distribute.yml runs on its publish.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The other half of the guard above. Installing the App and adding its two
  # credentials needs a human with admin rights, so the workflow cannot do it
  # and must not pretend the release automation is running when it is not.
  # This job reports the state and exits 0: green, and specific about why.
  credentials-notice:
    name: Report the missing release credentials
    if: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Say which credentials a maintainer has to add
        run: |
          echo "::notice title=Release automation is not configured::release-please did not run; see the job log for the two credentials a maintainer has to add."
          cat <<'NOTICE'
          This repository has no release credentials, so the release-please job was
          skipped rather than failed. Nothing is broken and nothing is pending.

          To turn release automation on, a maintainer with admin rights does three things:

            1. Install the release-please GitHub App on P4suta/ginary, granting it
               contents: write, pull-requests: write and issues: write.
            2. Add the repository variable RELEASE_PLEASE_APP_CLIENT_ID, set to the
               App's client id.
            3. Add the repository secret RELEASE_PLEASE_APP_PRIVATE_KEY, set to the
               App's private key.

          The default GITHUB_TOKEN is deliberately not an alternative: this repository
          sets can_approve_pull_request_reviews to false, so GitHub Actions may not
          create pull requests, and that hardening stays.
          NOTICE
