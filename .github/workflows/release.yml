# SPDX-License-Identifier: MIT OR Apache-2.0
name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Maintain the release PR and draft
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Fetch automation credentials
        id: credentials
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: ginary
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.credentials.outcome == 'success' && (
          steps.credentials.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.credentials.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.credentials.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.credentials.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ steps.credentials.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.credentials.outputs.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
