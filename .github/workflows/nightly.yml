# SPDX-License-Identifier: MIT OR Apache-2.0
name: Nightly

# The heavy assurance passes, kept off the pull-request path so PR CI stays
# fast. Mutation testing, the fuzz smoke and the full cross-Linux smoke matrix
# run on a schedule and on demand.
on:
  schedule:
    # 03:17 UTC daily; an odd minute so it does not land on the hour with every
    # other project's nightly.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutation testing (${{ matrix.module }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # The budget, and it is argued rather than guessed. The measured record is
    # tests/fixtures/nightly/mutants-measured.json — mutant counts per module
    # and 210 seconds a mutant, read off run 33969332537, the first nightly in
    # which every shard reached `ok Unmutated baseline`. 210 is that run's own
    # per-mutant cost (about 39 s of build and 171 of test), not the 107 s
    # average of the one small shard that finished; the record's README argues
    # why the conservative figure is the one to size a budget from. The largest
    # shard below holds 35 mutants, which that record prices at about 127
    # minutes, and
    # tests/regressions/e21_a_mutation_shard_could_not_finish_inside_its_budget.rs
    # fails if any shard stops fitting.
    #
    # What that argument does not bound is the worst case. `--timeout 420`
    # below caps one mutant, not the shard, so 35 mutants that all hang cost
    # about four hours and would be cancelled again. The pass is bounded in
    # expectation; docs/dev/testing.md says so beside the other things it does
    # not cover.
    #
    # It used to be 90 against whole modules of up to 207 mutants — five to
    # twelve hours of work. Six of the seven shards of run 33969332537 were
    # cancelled at the cap or lost to a runner shutdown, and a cancelled job
    # neither passes nor fails: the pass gated nothing at all.
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      GINARY_REQUIRE_TOOLCHAIN: "1"
    strategy:
      fail-fast: false
      # Sharded over the highest-value modules so one slow shard does not hold
      # the others, and a survivor is attributed to a module rather than a run.
      # Every module is divided into as many shards as it needs to fit the
      # budget above, and every shard of every division is run: a division that
      # dropped a shard would be a module only partly mutated, which is the one
      # way to make a budget fit that proves less rather than dividing more.
      matrix:
        include:
          - { module: appfile, shard: "0/6" }
          - { module: appfile, shard: "1/6" }
          - { module: appfile, shard: "2/6" }
          - { module: appfile, shard: "3/6" }
          - { module: appfile, shard: "4/6" }
          - { module: appfile, shard: "5/6" }
          - { module: cache, shard: "0/6" }
          - { module: cache, shard: "1/6" }
          - { module: cache, shard: "2/6" }
          - { module: cache, shard: "3/6" }
          - { module: cache, shard: "4/6" }
          - { module: cache, shard: "5/6" }
          - { module: closure, shard: "0/3" }
          - { module: closure, shard: "1/3" }
          - { module: closure, shard: "2/3" }
          - { module: launch, shard: "0/3" }
          - { module: launch, shard: "1/3" }
          - { module: launch, shard: "2/3" }
          - { module: payload, shard: "0/3" }
          - { module: payload, shard: "1/3" }
          - { module: payload, shard: "2/3" }
          - { module: trailer, shard: "0/1" }
          - { module: verify, shard: "0/3" }
          - { module: verify, shard: "1/3" }
          - { module: verify, shard: "2/3" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.5"
          gleam-version: "1.18.1"
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-mutants@27.1.0
      # A missed or timed-out mutant fails the shard: the caught-percentage gate
      # is "every mutant this module produces is caught".
      #
      # `--timeout` is what one mutant may spend in the suite. `cargo mutants`
      # runs the tests once per mutant, and a mutant that removes a loop's exit
      # condition does not end; with no cap the only thing that stops it is the
      # job's own budget, so one hang costs the whole shard and reports nothing
      # about the mutants it never reached. 420 seconds is about two and a half
      # times the measured per-mutant test time.
      - run: >-
          cargo mutants
          --file "src/${{ matrix.module }}.rs"
          --shard "${{ matrix.shard }}"
          --timeout 420
          --features fault-injection

  fuzz:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [trailer_parse, appfile_terms, beam_chunks, payload_read_manifest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-fuzz@0.13.2
      # 30 seconds per target, seeded from the committed corpus; a crash is a
      # failed job with the reproducer in the log.
      #
      # --target is named rather than defaulted. cargo-fuzz with no --target
      # builds for the triple its own binary was compiled for, and the install
      # step above downloads a prebuilt archive built for
      # x86_64-unknown-linux-musl; musl links libc statically, and rustc
      # refuses a sanitizer against a statically linked libc:
      #   error: sanitizer is incompatible with statically linked libc,
      #   disable it using `-C target-feature=-crt-static`
      # Every run of this job failed on that until 2026-09-05. Adding the musl
      # target would silence only the second, consequential error ("can't find
      # crate for `core`") and leave the first standing; this runner's own
      # triple is a gnu one and links libc dynamically, so naming it is the
      # fix. Pinned by tests/ci_matrix.rs and tests/regressions/
      # e19_the_fuzz_smoke_built_for_the_triple_cargo_fuzz_was_installed_for.rs.
      #
      # The `mkdir` is the precondition, not a convenience. `fuzz/corpus/` is
      # where libFuzzer writes *new* inputs, so it is empty at checkout and git
      # tracks no empty directory; libFuzzer refuses to start without it:
      #   ERROR: The required directory "fuzz/corpus/trailer_parse" does not exist
      # All four shards of run 33969332537 exited 1 on that line. `mise.toml`'s
      # `fuzz` task has always created it and this job did not, which is why
      # tests/ci_matrix.rs now reduces both callers to one plan and compares
      # them; see tests/regressions/
      # e21_the_fuzz_smoke_never_created_the_corpus_it_passed.rs.
      - run: |
          mkdir -p fuzz/corpus/"${{ matrix.target }}"
          cargo fuzz run --target x86_64-unknown-linux-gnu "${{ matrix.target }}" \
            fuzz/corpus/"${{ matrix.target }}" fuzz/seeds/"${{ matrix.target }}" \
            -- -max_total_time=30 -rss_limit_mb=4096

  smoke-matrix:
    name: Full cross-Linux smoke matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      GINARY_REQUIRE_TOOLCHAIN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.5"
          gleam-version: "1.18.1"
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cross@0.2.5
      # Pinned to a manifest digest, as in ci.yml's `smoke-matrix` job and for
      # the same reason: `--privileged` gives the container this runner's own
      # kernel capabilities, and a tag can be moved upstream with no commit
      # here. The digest names the multi-platform index, which is
      # `tonistiigi/binfmt:qemu-v10.2.3` as of 2026-09-04.
      - name: Bootstrap binfmt for arm64
        run: docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
      # One target directory per triple: a `cross` target directory belongs to
      # one container image, and a host build script cached in the musl image
      # does not start in the deliberately ancient gnu one. The same fix as
      # ci.yml's `smoke-matrix`, which is where the failure was read; see
      # tests/regressions/e5_one_cross_target_directory_was_shared_between_images.rs.
      - name: Build the cross stubs and repack the catalog
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          mkdir -p target/stubs
          for entry in \
            linux-x86_64-musl:x86_64-unknown-linux-musl \
            linux-x86_64-gnu:x86_64-unknown-linux-gnu \
            linux-aarch64-musl:aarch64-unknown-linux-musl; do
            name=${entry%%:*}; triple=${entry##*:}
            ( export CARGO_TARGET_DIR="target/cross/$triple"
              cross build --release --locked --no-default-features --target "$triple"
              cp "$CARGO_TARGET_DIR/$triple/release/ginary" \
                 "target/stubs/ginary-stub-$version-$name" )
          done
          cargo run --quiet --locked -- otp repack \
            --upstream-tag OTP-29.0.5 \
            --targets linux-x86_64-musl:static,linux-x86_64-gnu,linux-aarch64-musl:static \
            --out dist/otp
      - run: scripts/smoke-matrix.sh
        env:
          GINARY_STUB_DIR: ${{ github.workspace }}/target/stubs
