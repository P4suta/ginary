# SPDX-License-Identifier: MIT OR Apache-2.0
name: Parser fuzz assurance

on:
  workflow_dispatch:
  workflow_call:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [trailer_parse, appfile_terms, beam_chunks, payload_read_manifest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-fuzz@0.13.2
      # The gnu triple avoids the musl binary's crt-static sanitizer error.
      - name: Explore the committed parser corpus
        run: |
          mkdir -p fuzz/corpus/"${{ matrix.target }}"
          source scripts/ci/fuzz-evidence.sh
          cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
          cargo fuzz run --target x86_64-unknown-linux-gnu "${{ matrix.target }}" \
            fuzz/corpus/"${{ matrix.target }}" fuzz/seeds/"${{ matrix.target }}" \
            -- -runs=10000 -seed=1 -rss_limit_mb=4096
        env:
          FUZZ_TARGET: ${{ matrix.target }}
      - name: Preserve corpus and crash evidence
        if: ${{ always() }}
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p target/fuzz-evidence/corpus target/fuzz-evidence/crashes
          if [ -d "fuzz/corpus/$FUZZ_TARGET" ]; then
            cp -a "fuzz/corpus/$FUZZ_TARGET/." target/fuzz-evidence/corpus/
          fi
          if [ -d "fuzz/artifacts/$FUZZ_TARGET" ]; then
            cp -a "fuzz/artifacts/$FUZZ_TARGET/." target/fuzz-evidence/crashes/
          fi
          if [ ! -f target/fuzz-evidence/run.json ]; then
            printf '{"schema_version":1,"target":"%s","status":"not_run","complete":false}\n' "$FUZZ_TARGET" > target/fuzz-evidence/run.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: fuzz-${{ matrix.target }}
          path: target/fuzz-evidence
          retention-days: 7
          if-no-files-found: warn
