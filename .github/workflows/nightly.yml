# SPDX-License-Identifier: MIT OR Apache-2.0
name: Nightly

# Sustained exploration supplements the required pull-request checks.
# Every pass retains its evidence and reports incomplete execution explicitly.
on:
  schedule:
    # 03:17 UTC daily; an odd minute so it does not land on the hour with every
    # other project's nightly.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  mutation-plan:
    name: Assign every mutation to a native runner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-mutants@27.1.0
      - name: Test and build the cfg parser with its own locked dependencies
        run: |
          cargo test --manifest-path tools/mutation-plan/Cargo.toml --locked --no-fail-fast
          cargo build --manifest-path tools/mutation-plan/Cargo.toml --locked
          python3 -m unittest discover -s scripts/ci -p 'mutation_test.py'
      - name: Enumerate all canonical shards and assign applicable operating systems
        id: plan
        # cargo mutants lists cfg-inactive functions too. Retain its complete
        # discovery before using the Rust AST to dispatch native execution.
        run: >-
          python3 scripts/ci/mutation.py plan
          --planner tools/mutation-plan/target/debug/ginary-mutation-plan
          --output target/mutation-plan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: mutation-plan
          path: target/mutation-plan
          retention-days: 30
          if-no-files-found: warn

  mutants:
    name: Mutation testing (${{ matrix.id }})
    needs: mutation-plan
    runs-on: ${{ matrix.runner }}
    # tests/fixtures/nightly/mutants-measured.json is the historical timing
    # record. scripts/ci/mutation-divisions.json holds every canonical shard:
    # appfile, cache, closure, launch, payload, trailer, verify. Discovery
    # rejects a shard over 13 candidates before dispatching any native subset.
    # 13 * (120s build + 420s test), baseline and evidence fit in 150 minutes.
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      # Linux hosted runners provide Docker and the POSIX toolchain. Native
      # macOS/Windows promise Gleam + OTP (startup checked by mutation.py);
      # unavailable platform/cross tools remain explicit skips in test logs.
      GINARY_REQUIRE_TOOLCHAIN: ${{ matrix.platform == 'linux' && '1' || '0' }}
      GINARY_TEST_EVIDENCE_DIR: ${{ github.workspace }}/target/mutation-evidence/test-failures
      MUTATION_JOB: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.5"
          gleam-version: "1.18.1"
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-mutants@27.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-plan
          path: target/mutation-plan
      - name: Verify the exact native selection and execute every assigned mutation
        shell: bash
        run: >-
          python3 scripts/ci/mutation.py run
          --bundle target/mutation-plan/plan.json
          --job "$MUTATION_JOB"
          --output target/mutation-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: mutants-${{ matrix.id }}
          path: target/mutation-evidence
          retention-days: 30
          if-no-files-found: warn

  mutation-gate:
    name: Reconcile every planned mutation and native result
    needs: [mutation-plan, mutants]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-plan
          path: target/mutation-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ always() }}
        with:
          pattern: mutants-*
          path: target/mutation-results
      - name: Fail on missing, interrupted, mismatched or surviving mutations
        if: ${{ always() }}
        run: >-
          python3 scripts/ci/mutation.py finalize
          --bundle target/mutation-plan/plan.json
          --evidence target/mutation-results
          --output target/mutation-summary.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: mutation-summary
          path: target/mutation-summary.json
          retention-days: 30
          if-no-files-found: warn

  fuzz:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: [trailer_parse, appfile_terms, beam_chunks, payload_read_manifest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-fuzz@0.13.2
      # 600 seconds per target, seeded from the committed and retained corpus; a crash is a
      # failed job with the reproducer in the log.
      #
      # --target is named rather than defaulted. cargo-fuzz with no --target
      # builds for the triple its own binary was compiled for, and the install
      # step above downloads a prebuilt archive built for
      # x86_64-unknown-linux-musl; musl links libc statically, and rustc
      # refuses a sanitizer against a statically linked libc:
      #   error: sanitizer is incompatible with statically linked libc,
      #   disable it using `-C target-feature=-crt-static`
      # Every run of this job failed on that until 2026-09-05. Adding the musl
      # target would silence only the second, consequential error ("can't find
      # crate for `core`") and leave the first standing; this runner's own
      # triple is a gnu one and links libc dynamically, so naming it is the
      # fix. Pinned by tests/ci_matrix.rs and tests/regressions/
      # e19_the_fuzz_smoke_built_for_the_triple_cargo_fuzz_was_installed_for.rs.
      #
      # The `mkdir` is the precondition, not a convenience. `fuzz/corpus/` is
      # where libFuzzer writes *new* inputs, so it is empty at checkout and git
      # tracks no empty directory; libFuzzer refuses to start without it:
      #   ERROR: The required directory "fuzz/corpus/trailer_parse" does not exist
      # All four shards of run 33969332537 exited 1 on that line. `mise.toml`'s
      # `fuzz` task has always created it and this job did not, which is why
      # tests/ci_matrix.rs now reduces both callers to one plan and compares
      # them; see tests/regressions/
      # e21_the_fuzz_smoke_never_created_the_corpus_it_passed.rs.
      - name: Restore the previous completed run's generated corpus
        env:
          GH_TOKEN: ${{ github.token }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p fuzz/corpus/"${{ matrix.target }}"
          previous=$(gh run list --workflow nightly.yml --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$previous" ]; then
            present=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$previous/artifacts" --jq ".artifacts[] | select(.name == \"fuzz-$FUZZ_TARGET\" and .expired == false) | .id")
            if [ -n "$present" ]; then
              gh run download "$previous" --name "fuzz-$FUZZ_TARGET" --dir fuzz/previous
              if [ -d "fuzz/previous/corpus" ]; then
                cp -a "fuzz/previous/corpus/." "fuzz/corpus/$FUZZ_TARGET/"
              fi
            else
              echo "No retained corpus for $FUZZ_TARGET in run $previous; starting from committed seeds"
            fi
          else
            echo "No completed nightly run; starting from committed seeds"
          fi
      - run: |
          source scripts/ci/fuzz-evidence.sh
          # cargo-fuzz does not forward --locked. Resolve first so a stale
          # dedicated lockfile fails instead of silently selecting new inputs.
          cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
          cargo fuzz run --target x86_64-unknown-linux-gnu "${{ matrix.target }}" \
            fuzz/corpus/"${{ matrix.target }}" fuzz/seeds/"${{ matrix.target }}" \
            -- -max_total_time=600 -rss_limit_mb=4096
        env:
          FUZZ_TARGET: ${{ matrix.target }}

      - name: Stage a stable corpus evidence layout
        if: ${{ always() }}
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p target/fuzz-evidence/corpus target/fuzz-evidence/crashes
          if [ -d "fuzz/corpus/$FUZZ_TARGET" ]; then
            cp -a "fuzz/corpus/$FUZZ_TARGET/." target/fuzz-evidence/corpus/
          fi
          if [ -d "fuzz/artifacts/$FUZZ_TARGET" ]; then
            cp -a "fuzz/artifacts/$FUZZ_TARGET/." target/fuzz-evidence/crashes/
          fi
          if [ ! -f target/fuzz-evidence/run.json ]; then
            printf '{"schema_version":1,"target":"%s","status":"not_run","complete":false}\n' "$FUZZ_TARGET" > target/fuzz-evidence/run.json
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: fuzz-${{ matrix.target }}
          path: target/fuzz-evidence
          retention-days: 30
          if-no-files-found: warn
  formal:
    name: Cache protocol model checking
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/ci/formal.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: formal-evidence
          path: |
            target/assurance/formal
            .cache/tla/states
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
  smoke-matrix:
    name: Full cross-Linux smoke matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      GINARY_REQUIRE_TOOLCHAIN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.5"
          gleam-version: "1.18.1"
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cross@0.2.5
      # Pinned to a manifest digest, as in ci.yml's `smoke-matrix` job and for
      # the same reason: `--privileged` gives the container this runner's own
      # kernel capabilities, and a tag can be moved upstream with no commit
      # here. The digest names the multi-platform index, which is
      # `tonistiigi/binfmt:qemu-v10.2.3` as of 2026-09-04.
      - name: Bootstrap binfmt for arm64
        run: docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
      # One target directory per triple: a `cross` target directory belongs to
      # one container image, and a host build script cached in the musl image
      # does not start in the deliberately ancient gnu one. The same fix as
      # ci.yml's `smoke-matrix`, which is where the failure was read; see
      # tests/regressions/e5_one_cross_target_directory_was_shared_between_images.rs.
      - name: Build the cross stubs and repack the catalog
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          mkdir -p target/stubs
          for entry in \
            linux-x86_64-musl:x86_64-unknown-linux-musl \
            linux-x86_64-gnu:x86_64-unknown-linux-gnu \
            linux-aarch64-musl:aarch64-unknown-linux-musl; do
            name=${entry%%:*}; triple=${entry##*:}
            ( export CARGO_TARGET_DIR="target/cross/$triple"
              cross build --release --locked --no-default-features --target "$triple"
              cp "$CARGO_TARGET_DIR/$triple/release/ginary" \
                 "target/stubs/ginary-stub-$version-$name" )
          done
          cargo run --quiet --locked -- otp repack \
            --upstream-tag OTP-29.0.5 \
            --targets linux-x86_64-musl:static,linux-x86_64-gnu,linux-aarch64-musl:static \
            --out dist/otp
        env:
          # `ginary otp repack` reads the upstream release through the GitHub
          # API. An unauthenticated read is limited to 60 an hour by source
          # address, which every hosted runner in a pool shares, and the answer
          # over it is a 403 nothing retries its way out of. `contents: read` is
          # all this needs; the token moves the read onto this repository's own
          # budget. See tests/regressions/e22_an_unauthenticated_api_read_was_refused_without_saying_why.rs.
          GITHUB_TOKEN: ${{ github.token }}
      - run: bash scripts/ci/smoke-matrix-evidence.sh
        env:
          GINARY_STUB_DIR: ${{ github.workspace }}/target/stubs
      - name: Record a matrix that never started
        if: ${{ always() }}
        run: |
          mkdir -p target/assurance/smoke-matrix
          if [ ! -f target/assurance/smoke-matrix/run.json ]; then
            printf '{"schema_version":1,"status":"not_run","complete":false}\n' > target/assurance/smoke-matrix/run.json
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: nightly-smoke-matrix-evidence
          path: target/assurance/smoke-matrix
          retention-days: 30
          if-no-files-found: warn
