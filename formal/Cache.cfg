\* The finite instance TLC checks: two launchers racing one pruner over two
\* cache keys. Two processes rather than three because two are enough to
\* produce every race the protocol has — a lost rename, a prune between a
\* launcher's decision and its lock, and a sweep of somebody else's leftovers
\* — and because I3 is a liveness property, which is the expensive half.

CONSTANTS
    Procs = {p1, p2}
    Keys = {k1, k2}

SPECIFICATION Spec

INVARIANTS
    TypeOK
    I1
    I2
    I4

PROPERTIES
    I3
