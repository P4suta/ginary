# SPDX-License-Identifier: MIT OR Apache-2.0
[graph]
all-features = true
# Exactly the triples `Target::rust_triple()` returns for `target::ALL`, so a
# dependency that is only pulled in on one platform is still checked. The unit
# test `cargo_deny_checks_every_target_ginary_models` keeps the two lists in
# step. Windows is the `-gnu` ABI, not `-msvc`: the stub is cross-compiled.
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]

[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
