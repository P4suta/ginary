[tools]
gleam = "1.18.1"
erlang = "29.0.5"
# Only `mise run formal` needs it: TLC is a Java program, and the alternative
# to declaring the JDK here is a model-checking task that works on whichever
# machine happens to have one.
java = "temurin-25"

[tasks.fmt]
description = "Format all Rust sources"
run = "cargo fmt --all"

[tasks.lint]
description = "Check formatting and run clippy with warnings denied"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --all-targets --all-features -- -D warnings",
]

[tasks."lint:plain"]
description = "Run clippy over the default feature set, with warnings denied"
# `lint` passes `--all-features`, which compiles the `fault-injection` tests in
# and hides anything that is dead code without them. This task is the other
# half: it is what a contributor's plain `cargo clippy --all-targets` does, and
# it is in `check` so a helper that only the gated tests call cannot go
# unnoticed until someone runs clippy without the feature.
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Run the whole suite: unit, integration and documentation tests"
# `--features fault-injection` compiles the launcher's named fault points in.
# They are off by default so that a release artifact holds none of them and
# never reads `GINARY_FAULT`; three of the launcher's guarantees — the sweep of
# a killed extraction, the lost rename race, a payload that changes under the
# reader — are about timing and cannot be reached any other way.
run = "cargo test --features fault-injection"

[tasks."test:fast"]
description = "Run only the tests that need no external toolchain"
# Named explicitly rather than as plain `cargo test` minus something: no test in
# the library, the binary, `tests/smoke_cli.rs` or `tests/regressions.rs`
# *requires* `gleam`, `erl`, `strip` or `docker`; the regression target runs
# stub scripts on a `PATH` of its own making. The smoke test does drive the real
# `doctor`, which probes whatever is on `PATH`, bounded by
# `doctor::PROBE_TIMEOUT`; see `docs/dev/testing.md`. The remaining targets are
# outside this task because each holds a handful of `require_tools`-gated tests.
run = "cargo test --features fault-injection --lib --bins --test smoke_cli --test regressions"

[tasks."test:nextest"]
description = "Run the suite under nextest (no doc tests: nextest does not run them)"
run = "cargo nextest run --features fault-injection"

[tasks.deny]
description = "Check licences, advisories, bans and sources with cargo-deny"
run = "cargo deny check"

[tasks.cov]
description = "Coverage: an lcov report plus a summary, gated at 90% lines"
# The second invocation re-renders the profile data the first collected, so the
# suite runs once. Branch coverage needs a nightly `-Z coverage-options=branch`
# build; until this crate is measured that way the 80% branch floor in
# `docs/dev/testing.md` is documented but not enforced here.
run = [
  "cargo llvm-cov --all-features --workspace --lcov --output-path target/lcov.info",
  "cargo llvm-cov report --summary-only --fail-under-lines 90",
]

[tasks.mutants]
description = "Mutation testing over the whole crate"
# No `--in-place`: cargo-mutants copies the tree to a temporary directory, so a
# killed run cannot leave a mutated source behind. Sharding (`--shard i/n`)
# arrives with the nightly CI job.
run = "cargo mutants"

[tasks."fuzz:build"]
description = "Build every cargo-fuzz target (nightly toolchain)"
# `fuzz/` is a workspace of its own, so the root gates stay on stable and only
# this task and `fuzz` need a nightly toolchain. See `docs/dev/testing.md`.
run = "cargo +nightly fuzz build"

[tasks.fuzz]
description = "Run each fuzz target for 30 seconds (nightly toolchain)"
# Sequential rather than parallel: four libFuzzer processes at four gigabytes
# each is not a thing to start by accident, and a crash is easier to attribute
# when one target is running on its own.
#
# `fuzz/seeds/<target>` is the committed corpus and is passed second, so new
# inputs land in the generated `fuzz/corpus/<target>` and the seeds stay as
# they are. Three of the four parsers begin with a magic a fuzzer will not
# guess — `GINARY\0`, `FOR1`, a zstd frame header — and without those seeds the
# targets measure the first `if` and nothing else.
run = """
set -e
for target in trailer_parse appfile_terms beam_chunks payload_read_manifest; do
  echo "fuzz: $target"
  mkdir -p fuzz/corpus/"$target"
  cargo +nightly fuzz run "$target" fuzz/corpus/"$target" fuzz/seeds/"$target" \
    -- -max_total_time=30 -rss_limit_mb=4096
done
"""

[tasks.doc]
description = "Build the API documentation with rustdoc warnings denied"
env = { RUSTDOCFLAGS = "-Dwarnings" }
run = "cargo doc --no-deps"

[tasks.build]
description = "Build the release binary"
run = "cargo build --release"

[tasks.smoke]
description = "Clean-room artifact smoke test in Docker"
# Needs a docker daemon and pulls `ubuntu:24.04`. Without a reachable daemon it
# reports a skip and exits zero, the same rule `require_tools` follows in the
# test suite; `GINARY_REQUIRE_TOOLCHAIN=1` turns that skip into a failure, and
# the CI job sets it. `GINARY_BIN` points the script at a release binary, which
# is what the artifact size in `docs/dev/log/A4.md` was measured with.
run = "scripts/smoke.sh"

[tasks.package]
description = "Package the hello_ffi fixture and print the size report"
# The developer's window onto a real build: a copy of the fixture, so nothing
# is written into the repository, and the report `ginary build` prints for it.
run = """
set -e
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
cp -R tests/fixtures/hello_ffi "$work/hello_ffi"
rm -rf "$work/hello_ffi/build"
cd "$work/hello_ffi"
cargo run --quiet --manifest-path "$MISE_PROJECT_ROOT/Cargo.toml" -- build
"""

[tasks.formal]
description = "Model-check formal/Cache.tla with TLC"
# `tla2tools.jar` is not something mise installs, so the task fetches it once
# into `.cache/tla/` and checks it against a pinned digest before it runs a
# line of it: a jar fetched over the network without a digest is a jar nobody
# checked. Removing the file is how you take a new version — the digest below
# has to move with it.
#
# TLC's `-deadlock` flag *disables* deadlock checking ("if specified DO NOT
# CHECK FOR DEADLOCK"), so it is deliberately not passed: this model has no
# terminal state — every phase a launcher can be in has an action out of it,
# and a holding pruner always has its removal — and turning the check off
# would be giving up an invariant rather than adding one.
#
# `-metadir` keeps TLC's state directory out of `formal/`, which holds the
# model and its configuration and nothing else.
run = """
set -eu
root="${MISE_PROJECT_ROOT:-$PWD}"
cache="$root/.cache/tla"
jar="$cache/tla2tools.jar"
url="https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
sha256="936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"

mkdir -p "$cache"
if [ ! -f "$jar" ]; then
  echo "formal: fetching $url"
  curl -sSfL --retry 3 -o "$jar.part" "$url"
  mv "$jar.part" "$jar"
fi
printf '%s  %s\\n' "$sha256" "$jar" | sha256sum -c - > /dev/null || {
  echo "formal: $jar is not the pinned build; delete it and run again" >&2
  exit 1
}

java -XX:+UseParallelGC -jar "$jar" \
  -workers auto \
  -metadir "$cache/states" \
  "$root/formal/Cache.tla"
"""

[tasks.check]
description = "The pull-request gate: lint, lint:plain, test, doc and deny"
run = [
  "mise run lint",
  "mise run lint:plain",
  "mise run test",
  "mise run doc",
  "mise run deny",
]
