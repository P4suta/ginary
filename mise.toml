[tools]
gleam = "1.18.1"
erlang = "29.0.5"
# Only `mise run formal` needs it: TLC is a Java program, and the alternative
# to declaring the JDK here is a model-checking task that works on whichever
# machine happens to have one.
# Temurin 26 is offered; the JDK stays on 25 because `mise run formal` pins
# TLC by digest and the pair is validated together. See docs/dev/log/E4.md.
java = "temurin-25"

[tasks.fmt]
description = "Format all Rust sources"
run = "cargo fmt --all"

[tasks.lint]
description = "Check formatting and run clippy with warnings denied"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --all-targets --all-features -- -D warnings",
]

[tasks."lint:stub"]
description = "Run clippy over the launcher-only stub build, with warnings denied"
# The third feature set the gate has to hold: `--no-default-features` is the
# stub a cross-target artifact is made from, and nothing in `lint` or
# `lint:plain` compiles it. Without this task a module the `cli` feature was
# supposed to gate could stop compiling without it and nobody would find out
# until `stubs:build`.
run = "cargo clippy --no-default-features --all-targets -- -D warnings"

[tasks."lint:plain"]
description = "Run clippy over the default feature set, with warnings denied"
# `lint` passes `--all-features`, which compiles the `fault-injection` tests in
# and hides anything that is dead code without them. This task is the other
# half: it is what a contributor's plain `cargo clippy --all-targets` does, and
# it is in `check` so a helper that only the gated tests call cannot go
# unnoticed until someone runs clippy without the feature.
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Run the whole suite: unit, integration and documentation tests"
# `--features fault-injection` compiles the launcher's named fault points in.
# They are off by default so that a release artifact holds none of them and
# never reads `GINARY_FAULT`; three of the launcher's guarantees — the sweep of
# a killed extraction, the lost rename race, a payload that changes under the
# reader — are about timing and cannot be reached any other way.
run = "cargo test --features fault-injection"

[tasks."test:fast"]
description = "Run only the tests that need no external toolchain"
# Named explicitly rather than as plain `cargo test` minus something: no test in
# the library, the binary, `tests/smoke_cli.rs` or `tests/regressions.rs`
# *requires* `gleam`, `erl`, `strip` or `docker`; the regression target runs
# stub scripts on a `PATH` of its own making. The smoke test does drive the real
# `doctor`, which probes whatever is on `PATH`, bounded by
# `doctor::PROBE_TIMEOUT`; see `docs/dev/testing.md`. The remaining targets are
# outside this task because each holds a handful of `require_tools`-gated tests.
run = "cargo test --features fault-injection --lib --bins --test smoke_cli --test regressions"

[tasks."test:stub"]
description = "Run the suite as the launcher-only stub build compiles it"
# The other flavor of the same suite. A test target whose claims are all about
# the command line half carries `#![cfg(feature = "cli")]` and runs nothing
# here; what remains is the launcher contract, the payload, the cache and the
# identity marker — the half a stub actually carries — asserted against a
# binary built without clap, without a TOML reader and without a `main` that
# has any commands. `tests/stub_flavor.rs` is the seam that makes the
# difference itself an assertion.
#
# No `--features fault-injection`: the fault points are a launcher feature and
# compile in either flavor, and `test` already runs them. This task exists to
# prove the stub build works, not to run the timing tests twice.
run = "cargo test --no-default-features"

[tasks."test:nextest"]
description = "Run the suite under nextest (no doc tests: nextest does not run them)"
run = "cargo nextest run --features fault-injection"

[tasks.deny]
description = "Check licences, advisories, bans and sources with cargo-deny"
run = "cargo deny check"

[tasks.cov]
description = "Coverage: an lcov report plus a summary, gated at 90% lines"
# The second invocation re-renders the profile data the first collected, so the
# suite runs once. Branch coverage needs a nightly `-Z coverage-options=branch`
# build; until this crate is measured that way the 80% branch floor in
# `docs/dev/testing.md` is documented but not enforced here.
run = [
  "cargo llvm-cov --all-features --workspace --lcov --output-path target/lcov.info",
  "cargo llvm-cov report --summary-only --fail-under-lines 90",
]

[tasks.mutants]
description = "Mutation testing over the whole crate"
# No `--in-place`: cargo-mutants copies the tree to a temporary directory, so a
# killed run cannot leave a mutated source behind. Sharding (`--shard i/n`)
# arrives with the nightly CI job.
run = "cargo mutants"

[tasks."fuzz:build"]
description = "Build every cargo-fuzz target (nightly toolchain)"
# `fuzz/` is a workspace of its own, so the root gates stay on stable and only
# this task and `fuzz` need a nightly toolchain. See `docs/dev/testing.md`.
run = "cargo +nightly fuzz build"

[tasks.fuzz]
description = "Run each fuzz target for 30 seconds (nightly toolchain)"
# Sequential rather than parallel: four libFuzzer processes at four gigabytes
# each is not a thing to start by accident, and a crash is easier to attribute
# when one target is running on its own.
#
# `fuzz/seeds/<target>` is the committed corpus and is passed second, so new
# inputs land in the generated `fuzz/corpus/<target>` and the seeds stay as
# they are. Three of the four parsers begin with a magic a fuzzer will not
# guess — `GINARY\0`, `FOR1`, a zstd frame header — and without those seeds the
# targets measure the first `if` and nothing else.
run = """
set -e
for target in trailer_parse appfile_terms beam_chunks payload_read_manifest; do
  echo "fuzz: $target"
  mkdir -p fuzz/corpus/"$target"
  cargo +nightly fuzz run "$target" fuzz/corpus/"$target" fuzz/seeds/"$target" \
    -- -max_total_time=30 -rss_limit_mb=4096
done
"""

[tasks.doc]
description = "Build the API documentation with rustdoc warnings denied"
env = { RUSTDOCFLAGS = "-Dwarnings" }
run = "cargo doc --no-deps"

[tasks.build]
description = "Build the release binary"
run = "cargo build --release"

[tasks.smoke]
description = "Clean-room artifact smoke test in Docker"
# Needs a docker daemon and pulls `ubuntu:24.04`. Without a reachable daemon it
# reports a skip and exits zero, the same rule `require_tools` follows in the
# test suite; `GINARY_REQUIRE_TOOLCHAIN=1` turns that skip into a failure, and
# the CI job sets it. `GINARY_BIN` points the script at a release binary, which
# is what the artifact size in `docs/dev/log/A4.md` was measured with.
run = "scripts/smoke.sh"

[tasks.package]
description = "Package the hello_ffi fixture and print the size report"
# The developer's window onto a real build: a copy of the fixture, so nothing
# is written into the repository, and the report `ginary build` prints for it.
run = """
set -e
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
cp -R tests/fixtures/hello_ffi "$work/hello_ffi"
rm -rf "$work/hello_ffi/build"
cd "$work/hello_ffi"
cargo run --quiet --manifest-path "$MISE_PROJECT_ROOT/Cargo.toml" -- build
"""

[tasks.formal]
description = "Model-check formal/Cache.tla with TLC"
# `tla2tools.jar` is not something mise installs, so the task fetches it once
# into `.cache/tla/` and checks it against a pinned digest before it runs a
# line of it: a jar fetched over the network without a digest is a jar nobody
# checked. Removing the file is how you take a new version — the digest below
# has to move with it.
#
# TLC's `-deadlock` flag *disables* deadlock checking ("if specified DO NOT
# CHECK FOR DEADLOCK"), so it is deliberately not passed: this model has no
# terminal state — every phase a launcher can be in has an action out of it,
# and a holding pruner always has its removal — and turning the check off
# would be giving up an invariant rather than adding one.
#
# `-metadir` keeps TLC's state directory out of `formal/`, which holds the
# model and its configuration and nothing else.
run = """
set -eu
root="${MISE_PROJECT_ROOT:-$PWD}"
cache="$root/.cache/tla"
jar="$cache/tla2tools.jar"
url="https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
sha256="936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"

mkdir -p "$cache"
if [ ! -f "$jar" ]; then
  echo "formal: fetching $url"
  curl -sSfL --retry 3 -o "$jar.part" "$url"
  mv "$jar.part" "$jar"
fi
printf '%s  %s\\n' "$sha256" "$jar" | sha256sum -c - > /dev/null || {
  echo "formal: $jar is not the pinned build; delete it and run again" >&2
  exit 1
}

java -XX:+UseParallelGC -jar "$jar" \
  -workers auto \
  -metadir "$cache/states" \
  "$root/formal/Cache.tla"
"""

[tasks."build:windows"]
description = "Cross-build both flavors of ginary for x86_64-pc-windows-gnu and print their sizes"
# The compile-time half of Windows support, and the only gate there is for it
# on a Linux machine. Both flavors, because a `cfg` split that compiles one of
# them is half a split: the launcher-only stub is what a Windows artifact is
# made of, and the full command line tool is what has to keep compiling for a
# target whose `std` has no `flock`, no mode bits and no `execve`.
#
# `cross`, not `cargo`: `zstd-sys` is C, and building it for this triple needs
# the mingw toolchain that lives in the cross image and not on this host.
#
# What this task does *not* prove is that any of it runs. There is no Windows
# machine and no `erl.exe` here, so the launcher's spawn, its job object and
# its console handler are compiled and nothing more. See `docs/dev/log/D2.md`
# and the `## Windows` section of `README.md`.
run = '''
set -eu
root="${MISE_PROJECT_ROOT:-$PWD}"
cd "$root"
# The same separate target directory `stubs:build` uses, and for the same
# reason: a build script compiled against this machine's glibc will not run in
# the container.
export CARGO_TARGET_DIR=target/cross
triple=x86_64-pc-windows-gnu

echo "build:windows: launcher-only stub ($triple)"
cross build --release --target "$triple" --no-default-features
stub=$(stat -c %s "target/cross/$triple/release/ginary.exe")

echo "build:windows: full command line tool ($triple)"
cross build --release --target "$triple"
full=$(stat -c %s "target/cross/$triple/release/ginary.exe")

echo
printf "  %-28s %10d bytes\n" "stub (--no-default-features)" "$stub"
printf "  %-28s %10d bytes\n" "full (default features)" "$full"
'''

[tasks."stubs:build"]
description = "Cross-build the launcher-only stubs into target/stubs and print their sizes"
# The developer's stub directory. `ginary build --target <t>` looks in
# `$GINARY_STUB_DIR` before anything else, so:
#
#     mise run stubs:build
#     export GINARY_STUB_DIR=$PWD/target/stubs
#
# is the whole cross-build loop for the stub half. `cross` runs the compiler in
# a container per target and falls back to plain `cargo` for the host triple,
# so the host stub is built without a docker daemon and the other four need
# one.
#
# Five targets, not seven: there is no macOS toolchain here and none that can
# be installed in a Linux container, so `macos-x86_64` and `macos-aarch64`
# stubs come from the CI release build on a macOS runner and from nowhere else.
# A `ginary build --target macos-*` on this machine finds no stub and says so,
# which is the honest answer.
#
# A target that fails to build is reported and the task carries on to the next
# one, then exits non-zero: a stub directory that is missing one target is
# still useful for the other four, and a task that hid the failure would let a
# broken target sit unnoticed. See `docs/dev/log/C2.md` for what built here.
run = '''
set -u
root="${MISE_PROJECT_ROOT:-$PWD}"
out="$root/target/stubs"
version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$root/Cargo.toml" | head -1)
mkdir -p "$out"
failed=""
# `cross` mounts the project at a path of its own choosing inside the
# container, so a host `--manifest-path` names a file that is not there. The
# working directory is what it maps, and it is the only way to tell it which
# project to build.
cd "$root"
# A target directory of its own, and this is not tidiness. Build scripts are
# compiled for the *host* and then run, and the host's are linked against this
# machine's glibc while the container's is years older: reusing `target/` makes
# every cross build fail on `version GLIBC_2.34 not found` in a build script
# nobody asked for. A separate directory means the container compiles and runs
# its own.
export CARGO_TARGET_DIR=target/cross

build() {
  name="$1"; triple="$2"; suffix="${3:-}"
  echo "stubs:build: $name ($triple)"
  # The copy is part of the success condition, not a step after it: a build
  # that produced a binary nothing could put in `$out` — a full disk, a
  # directory that is not writable, a suffix this table has wrong — is a
  # target that did not end up in the stub directory, and reporting it as
  # built would be exactly the silent skip `CLAUDE.md` forbids.
  if cross build --release --target "$triple" --no-default-features \
     && cp "$root/target/cross/$triple/release/ginary$suffix" \
           "$out/ginary-stub-$version-$name$suffix"; then
    :
  else
    echo "stubs:build: FAILED $name ($triple)" >&2
    failed="$failed $name"
  fi
}

build linux-x86_64-gnu    x86_64-unknown-linux-gnu
build linux-x86_64-musl   x86_64-unknown-linux-musl
build linux-aarch64-gnu   aarch64-unknown-linux-gnu
build linux-aarch64-musl  aarch64-unknown-linux-musl
build windows-x86_64      x86_64-pc-windows-gnu .exe

echo
echo "stubs in $out (ginary $version):"
ls -l "$out" | awk 'NR>1 { printf "  %-48s %10d bytes\n", $9, $5 }'
echo
echo "macos-x86_64 and macos-aarch64: no macOS toolchain here; those stubs come"
echo "from the CI release build and from nowhere else."

if [ -n "$failed" ]; then
  echo "stubs:build: these targets did not build:$failed" >&2
  exit 1
fi
'''

[tasks."otp:repack"]
description = "Repack the upstream Linux runtimes into the local catalog under dist/otp"
# The pipeline that would be a hosted `ginary-otp` repository, run here.
# Nothing is published: what comes out is `dist/otp/*.tar.zst` (gitignored) and
# `dist/otp/catalog.json` (committed), whose URLs are file names relative to
# itself, so a checkout with the tarballs beside it resolves them.
#
# The three rows are the ones `scripts/smoke-matrix.sh` runs and
# `tests/e2e_cross.rs` builds against. Roughly 130 MB of downloads the first
# time; assets already in `dist/otp/.upstream` are reused and re-hashed rather
# than fetched again. `SOURCE_DATE_EPOCH` makes two runs agree byte for byte.
run = """
set -eu
cargo run --quiet -- otp repack \
  --upstream-tag "${GINARY_OTP_TAG:-OTP-29.0.5}" \
  --targets linux-x86_64-musl:static,linux-x86_64-gnu,linux-aarch64-musl:static \
  --out dist/otp
"""

[tasks."smoke:matrix"]
description = "Cross-Linux smoke matrix: build for three targets and run each in a container"
# Needs a docker daemon, the stubs from `stubs:build` and the catalog from
# `otp:repack`; each absence is a reported skip naming the task that produces
# it, and `GINARY_REQUIRE_TOOLCHAIN=1` turns those skips into failures. The
# aarch64 row needs a binfmt handler, which the script probes for before it
# runs a `--privileged` container to install one.
run = "scripts/smoke-matrix.sh"

[tasks."check:windows"]
description = "Type-check the whole tree, tests included, for Windows (needs docker)"
# The check `tests/common/portability.rs` cannot perform. That scan reads one
# file's text and finds an ungated mention of `std::os::unix`; it cannot find
# an ungated *call* of something already `#[cfg(unix)]`, because such a call
# mentions no `os::unix`. Two of those were fatal on the first Windows job and
# invisible to every Linux gate. A real compile finds both, and `mingw-w64` is
# all a Linux host needs for one — the `x86_64-pc-windows-gnu` triple, not the
# msvc one, because `zstd-sys` compiles C.
#
# A container, because installing a Windows cross toolchain into a developer's
# machine to run one check is not a thing to ask. A target directory of its
# own inside the container, because the objects a foreign libc produces do not
# belong in `target/`. Roughly forty-five seconds warm, a few minutes cold.
run = """
set -eu
root="${MISE_PROJECT_ROOT:-$PWD}"
docker build -t ginary-wincheck:1 -f "$root/scripts/ci/wincheck.Dockerfile" "$root"
docker run --rm -v "$root":/w -w /w -e CARGO_TARGET_DIR=/tmp/t ginary-wincheck:1 \
  cargo check --all-targets --locked --keep-going --target x86_64-pc-windows-gnu
"""

[tasks."clean:cache"]
description = "Remove the regenerable build caches, keeping the cross-built stubs and the OTP catalog"
# The disk task. This machine ran out of space during E19 with
# `target/debug/incremental` at 25 GB, and the way out of that is a reviewed
# list of what goes rather than an `rm -rf` typed under pressure.
#
# Every removal below is regenerable by a plain `cargo` or `cargo mutants` run.
# Two trees inside the same directories are **not**, and neither is named here:
#
#   target/stubs   the five cross-built launcher stubs — `cross`, a docker
#                  daemon and minutes per target
#   dist/otp       the committed catalog and the runtime tarballs it names —
#                  roughly 130 MB of downloads and a repack
#
# Nine gated tests read those two, and between them they are three orders of
# magnitude smaller than what this task reclaims. That is also why the task
# does not run `cargo clean`: it would empty the whole of `target/`,
# `target/stubs` included.
#
# The paths are literal and relative, so what this deletes can be read off the
# diff. What makes that safe is the root check below rather than the `cd`
# alone: `MISE_PROJECT_ROOT` is set by `mise` and by nothing else, so a run
# block extracted and run by hand — which is how a disk chore actually gets
# done once the disk is full — would fall back to `$PWD` and delete the
# `target/debug` of whatever directory the caller was in. So the task refuses
# rather than guesses. `tests/ci_matrix.rs` holds the list and the rule, and
# `tests/regressions/e20_the_cleaner_deleted_the_directory_it_was_run_from.rs`
# runs this block over a throwaway tree.
run = '''
set -eu
root="${MISE_PROJECT_ROOT:-$PWD}"
if [ ! -f "$root/Cargo.toml" ] || [ ! -f "$root/mise.toml" ]; then
  echo "clean:cache: $root is not a project root (no Cargo.toml beside a mise.toml); nothing removed" >&2
  exit 1
fi
if ! grep -q '^name = "ginary"$' "$root/Cargo.toml"; then
  echo "clean:cache: $root is not ginary's checkout; nothing removed" >&2
  exit 1
fi
cd "$root"

before=$(du -sk target fuzz/target mutants.out 2>/dev/null | awk '{ total += $1 } END { print total + 0 }')

rm -rf fuzz/target
rm -rf mutants.out
rm -rf target/cross
rm -rf target/debug
rm -rf target/llvm-cov-target
rm -rf target/nextest
rm -rf target/release

after=$(du -sk target fuzz/target mutants.out 2>/dev/null | awk '{ total += $1 } END { print total + 0 }')
echo "clean:cache: reclaimed $(( (before - after) / 1024 )) MiB"
echo "clean:cache: kept target/stubs (mise run stubs:build) and dist/otp (mise run otp:repack)"
'''

[tasks.check]
description = "The pull-request gate: lint, lint:plain, lint:stub, test, test:stub, doc and deny"
run = [
  "mise run lint",
  "mise run lint:plain",
  "mise run lint:stub",
  "mise run test",
  "mise run test:stub",
  "mise run doc",
  "mise run deny",
]
