[tools]
gleam = "1.18.1"
erlang = "29.0.5"

[tasks.fmt]
description = "Format all Rust sources"
run = "cargo fmt --all"

[tasks.lint]
description = "Check formatting and run clippy with warnings denied"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --all-targets --all-features -- -D warnings",
]

[tasks.test]
description = "Run the whole suite: unit, integration and documentation tests"
run = "cargo test"

[tasks."test:fast"]
description = "Run only the tests that need no external toolchain"
# Named explicitly rather than as plain `cargo test` minus something: no test in
# the library, the binary, `tests/smoke_cli.rs` or `tests/regressions.rs`
# *requires* `gleam`, `erl`, `strip` or `docker`; the regression target runs
# stub scripts on a `PATH` of its own making. The smoke test does drive the real
# `doctor`, which probes whatever is on `PATH`, bounded by
# `doctor::PROBE_TIMEOUT`; see `docs/dev/testing.md`. The remaining targets are
# outside this task because each holds a handful of `require_tools`-gated tests.
run = "cargo test --lib --bins --test smoke_cli --test regressions"

[tasks."test:nextest"]
description = "Run the suite under nextest (no doc tests: nextest does not run them)"
run = "cargo nextest run"

[tasks.deny]
description = "Check licences, advisories, bans and sources with cargo-deny"
run = "cargo deny check"

[tasks.cov]
description = "Coverage: an lcov report plus a summary, gated at 90% lines"
# The second invocation re-renders the profile data the first collected, so the
# suite runs once. Branch coverage needs a nightly `-Z coverage-options=branch`
# build; until this crate is measured that way the 80% branch floor in
# `docs/dev/testing.md` is documented but not enforced here.
run = [
  "cargo llvm-cov --all-features --workspace --lcov --output-path target/lcov.info",
  "cargo llvm-cov report --summary-only --fail-under-lines 90",
]

[tasks.mutants]
description = "Mutation testing over the whole crate"
# No `--in-place`: cargo-mutants copies the tree to a temporary directory, so a
# killed run cannot leave a mutated source behind. Sharding (`--shard i/n`)
# arrives with the nightly CI job.
run = "cargo mutants"

[tasks.doc]
description = "Build the API documentation with rustdoc warnings denied"
env = { RUSTDOCFLAGS = "-Dwarnings" }
run = "cargo doc --no-deps"

[tasks.build]
description = "Build the release binary"
run = "cargo build --release"

# The plan lists `smoke` and `package` among the A0 tasks. They cannot do
# anything until there is an artifact to smoke test, so they are declared here
# and fail loudly rather than being silently absent.
[tasks.smoke]
description = "Clean-room artifact smoke test in Docker (not implemented until A5)"
run = '''
echo "smoke: not implemented until A5. It will run scripts/smoke.sh: build the" >&2
echo "  hello fixture, then \`docker run --rm --network none ubuntu:24.04\` the" >&2
echo "  artifact with no Erlang installed and assert the exit code propagates." >&2
exit 1
'''

[tasks.package]
description = "Package the fixture application into one executable (not implemented until A4)"
run = '''
echo "package: not implemented until A4. It will run \`ginary build\` over" >&2
echo "  tests/fixtures/hello_ginary and report the artifact size breakdown." >&2
exit 1
'''

[tasks.check]
description = "The pull-request gate: lint, test, doc and deny"
run = [
  "mise run lint",
  "mise run test",
  "mise run doc",
  "mise run deny",
]
