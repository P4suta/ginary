version = 1
SPDX-PackageName = "ginary"
SPDX-PackageSupplier = "ginary contributors"
SPDX-PackageDownloadLocation = "https://github.com/P4suta/ginary"

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ginary contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Copied verbatim from the Erlang/OTP 29.0.5 distribution so that the `.app`
# parser is tested against files it did not write. Reformatting them, headers
# included, would defeat the point, so their licence is declared here instead.
[[annotations]]
path = ["tests/fixtures/app/otp/**"]
precedence = "override"
SPDX-FileCopyrightText = "Ericsson AB and the Erlang/OTP contributors"
SPDX-License-Identifier = "Apache-2.0"

# Copied verbatim from `gleam export erlang-shipment`. Each file is generated
# from, and carries the description of, the Gleam package it belongs to.
[[annotations]]
path = ["tests/fixtures/app/shipment/**"]
precedence = "override"
SPDX-FileCopyrightText = "the gleam_stdlib, gleam_crypto, mist and notify authors"
SPDX-License-Identifier = "Apache-2.0"

# Compiled BEAM modules copied verbatim from `gleam export erlang-shipment`, so
# that the IFF chunk reader is tested against files it did not write. A binary
# carries no SPDX header; the path is declared here instead.
[[annotations]]
path = ["tests/fixtures/beam/*.beam"]
precedence = "override"
SPDX-FileCopyrightText = "the gleam_stdlib authors"
SPDX-License-Identifier = "Apache-2.0"

# `erts-17.0.5/bin/inet_gethost` from erlef/otp_builds' OTP-29.0.5 macOS
# arm64 release, copied verbatim so that `src/macho.rs` is tested against a
# real Mach-O it did not write. A binary carries no SPDX header; the path is
# declared here instead. See tests/fixtures/macho/README.md.
[[annotations]]
path = ["tests/fixtures/macho/inet_gethost-aarch64-apple-darwin"]
precedence = "override"
SPDX-FileCopyrightText = "Ericsson AB and the Erlang/OTP contributors"
SPDX-License-Identifier = "Apache-2.0"
