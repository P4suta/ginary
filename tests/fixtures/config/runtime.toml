#
# The six runtime keys B1 adds to `[tools.ginary]`, each set to something that
# is not its default, so a test can tell a value that was read from one that
# was assumed. `full.toml` covers the keys that came before them.

name = "runtime_app"
version = "0.4.2"
target = "erlang"

[dependencies]

[tools.ginary]
vm_args = "config/vm.args"
sys_config = "config/sys.config"
distribution = true
filename_encoding = "latin1"
heart = true

[tools.ginary.env]
LOG_LEVEL = "info"
RELEASE_NAME = "runtime_app"
