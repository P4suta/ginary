# SPDX-License-Identifier: MIT OR Apache-2.0
#
# The release workflow with one job too many. See this directory's README.md.
#
# The `release-please` job is `.github/workflows/release.yml`'s shape and is
# correct on every count: the check at position one, the notice on `absent`,
# the release step behind `configured`. The addition is the second job. It
# declares the same environment, so it is handed the same client id and the
# same private key, and its **first** step reads the key with no guard at all —
# there is nothing it could be guarded on, because `steps.credentials` is a
# context of the other job and does not exist here.
#
# The step being at position one is deliberate: a rule that excuses "position
# one" rather than "the step that computes the guard" excuses this one too.
#
# This file is never run. It lives outside `.github/`, so the repository-wide
# workflow scans do not reach it and actionlint is not asked about it; it is
# read only by `crate::common::repo`'s workflow readers.
name: Release (fixture)

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Maintain the release PR and draft
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check what the release environment holds
        id: credentials
        env:
          CLIENT_ID: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "state=configured" >> "$GITHUB_OUTPUT"
          else
            echo "state=absent" >> "$GITHUB_OUTPUT"
          fi
      - name: Say which credentials a maintainer has to add
        if: ${{ steps.credentials.outputs.state == 'absent' }}
        run: |
          echo "Add RELEASE_PLEASE_APP_CLIENT_ID and RELEASE_PLEASE_APP_PRIVATE_KEY to the release environment."
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: ${{ steps.credentials.outputs.state == 'configured' }}
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  announce:
    name: Announce the release
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Post the release note as the App
        env:
          PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
        run: |
          printf '%s' "$PRIVATE_KEY" > app.pem
          curl --fail --silent --key app.pem https://api.github.com/repos/P4suta/ginary/releases
